<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prioridades">
<meta name="description" content="Ordená qué materia estudiar primero, con grupos para juntar lo de cada momento.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Prioridades</title>
<style>
  /* Tema claro por defecto; el oscuro se aplica por preferencia del sistema
     o cuando el visor marca data-theme en la raiz. */
  :root{
    --bg:#f4f5fa;
    --bg-soft:#ffffff;
    --text:#14162a;
    --muted:#6b7192;
    --line:rgba(20,22,42,.12);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1220;
      --bg-soft:#171a2e;
      --text:#f2f3f8;
      --muted:#9aa0bd;
      --line:rgba(255,255,255,.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1220;
    --bg-soft:#171a2e;
    --text:#f2f3f8;
    --muted:#9aa0bd;
    --line:rgba(255,255,255,.14);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 64px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em}
  .sub{margin:6px 0 20px;color:var(--muted);font-size:13.5px;line-height:1.45}

  button{touch-action:manipulation}
  .ghost-btn{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:11px 18px;min-height:44px;font-size:14px;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .ghost-btn:hover{color:var(--text)}
  .ghost-btn:active{transform:scale(.97)}
  .add-btn{
    flex:1 1 0;min-width:130px;max-width:230px;color:var(--text);
    border-style:dashed;border-width:1.5px;font-size:15px;
  }
  .warn{
    display:none;margin:0 0 16px;padding:11px 13px;border-radius:12px;
    background:rgba(224,69,63,.12);border:1px solid rgba(224,69,63,.45);
    color:var(--text);font-size:12.5px;line-height:1.5;
  }
  .warn.show{display:block}

  #list{position:relative;display:flex;flex-direction:column;gap:12px;min-height:60px}

  .block{
    position:relative;
    display:flex;flex-direction:column;gap:8px;
    border-radius:var(--radius);
    padding:12px 12px 12px 13px;
    color:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    touch-action:pan-y;
  }
  .row{position:relative;display:flex;align-items:center;gap:10px;min-width:0}

  .block.dragging{
    z-index:50;pointer-events:none;
    box-shadow:0 18px 38px rgba(0,0,0,.4);
    opacity:.96;
  }
  .placeholder{
    border-radius:var(--radius);
    border:2px dashed rgba(127,133,166,.7);
    background:rgba(127,133,166,.12);
  }

  .rank{
    flex:0 0 auto;width:26px;height:26px;border-radius:9px;
    background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  }

  .block input{
    width:100%;background:transparent;border:0;color:#fff;
    font-family:inherit;padding:2px 0;border-radius:6px;
  }
  .block input:focus{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
  .name{flex:1 1 auto;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .subject{flex:1 1 auto;min-width:0;font-size:13.5px;opacity:.92}
  .block input::placeholder{color:rgba(255,255,255,.6);font-weight:500}

  .tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .tool{
    width:34px;height:30px;border:0;border-radius:8px;
    background:rgba(255,255,255,.18);color:#fff;
    font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .tool:hover{background:rgba(255,255,255,.3)}
  .tool:focus-visible,.swatch:focus-visible,.ghost-btn:focus-visible{
    outline:2px solid currentColor;outline-offset:2px;
  }
  .tool svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .handle{cursor:grab;touch-action:none}
  .handle:active{cursor:grabbing}

  /* Grupo: tarjeta con un hueco adentro, al estilo de los bloques en C
     de Scratch. El color queda como marco y las tarjetas de adentro
     conservan el suyo. */
  .group{padding-bottom:10px}
  .slot{
    display:flex;flex-direction:column;gap:10px;
    margin:2px 4px 0 14px;padding:10px;
    border-radius:12px;
    background:rgba(0,0,0,.2);
    min-height:56px;
  }
  .slot .block{box-shadow:0 4px 12px rgba(0,0,0,.22)}
  .hint{
    margin:0;padding:8px 4px;text-align:center;
    color:rgba(255,255,255,.75);font-size:12.5px;
  }
  .slot:has(.placeholder) .hint{display:none}
  .slot.hover{outline:2px dashed rgba(255,255,255,.7);outline-offset:2px}

  .palette{
    display:none;gap:8px;flex-wrap:wrap;
    padding:10px 4px 2px;margin-top:6px;
    border-top:1px solid rgba(255,255,255,.25);
  }
  .block.open-color > .palette{display:flex}
  .swatch{
    width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
    cursor:pointer;padding:0;
  }
  .swatch.current{box-shadow:0 0 0 3px rgba(255,255,255,.85)}

  /* Fecha limite */
  .fechas{
    display:none;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 4px 2px;margin-top:6px;
    border-top:1px solid rgba(255,255,255,.25);
  }
  .block.open-fecha > .fechas{display:flex}
  .fechas input[type="date"]{
    flex:1 1 150px;min-width:140px;width:auto;
    background:rgba(255,255,255,.18);color:#fff;
    border:0;border-radius:8px;padding:8px 10px;min-height:38px;
    font-family:inherit;font-size:14px;
  }
  .fechas input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9}
  .ancho{width:auto;padding:0 12px;height:38px;font-size:13px;font-weight:600}

  .plazo{
    display:flex;align-items:center;gap:6px;
    margin-top:-2px;font-size:12.5px;opacity:.92;
  }
  .plazo.tarde{font-weight:700;opacity:1}

  /* Al eliminar: se tacha, aparece DONE y recien ahi desaparece */
  .block.cerrando{pointer-events:none}
  .tachon{
    position:absolute;height:3px;margin-top:-1px;border-radius:2px;background:#fff;
    transform:scaleX(0);transform-origin:left center;
    animation:tachar .38s ease-out forwards;
  }
  @keyframes tachar{to{transform:scaleX(1)}}
  .sello{
    position:absolute;inset:0;z-index:2;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.3);border-radius:var(--radius);
    animation:aparecer .3s ease-out .35s both;
  }
  .sello .pastilla{
    display:flex;align-items:center;gap:8px;
    background:#fff;color:#12813f;
    padding:9px 16px;border-radius:999px;
    font-size:16px;font-weight:800;letter-spacing:.08em;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
    animation:sellar .32s cubic-bezier(.2,1.4,.4,1) .35s both;
  }
  .sello svg{width:20px;height:20px}
  .sello svg path{
    fill:none;stroke:currentColor;stroke-width:3.2;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:32;stroke-dashoffset:32;
    animation:tildar .34s ease-out .55s forwards;
  }
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  @keyframes sellar{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  @keyframes tildar{to{stroke-dashoffset:0}}
  .block.colapsando{
    overflow:hidden;padding-top:0;padding-bottom:0;
    transition:height .28s ease, opacity .28s ease, padding .28s ease, margin .28s ease;
  }

  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .block.nuevo{animation:pop .28s ease-out}
  @media (prefers-reduced-motion: reduce){
    .block.nuevo{animation:none}
    .tachon,.sello,.sello .pastilla,.sello svg path{animation-duration:.01ms}
  }

  .footer{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .footer + .footer{margin-top:12px}
  .small{padding:9px 14px;min-height:40px;font-size:13px}
  .tip{margin-top:18px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prioridades</h1>
    <button class="ghost-btn" id="reset" type="button">Vaciar</button>
  </header>
  <p class="sub">Arriba lo que estudias primero. Arrastrá desde ⠿ para ordenar, o soltá una tarjeta dentro de un grupo.</p>

  <p class="warn" id="warn"></p>

  <div id="list"></div>

  <div class="footer">
    <button class="ghost-btn add-btn" id="add" type="button">+ Tarjeta</button>
    <button class="ghost-btn add-btn" id="addGroup" type="button">+ Grupo</button>
  </div>
  <div class="footer">
    <button class="ghost-btn small" id="export" type="button">Guardar copia</button>
    <button class="ghost-btn small" id="import" type="button">Abrir copia</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
  <p class="tip">Se guarda solo en este dispositivo. Hacé una copia de vez en cuando.</p>
</div>

<script>
(function(){
  "use strict";

  var COLORS = [
    "#e0453f", "#e8792c", "#e3b31c", "#3aa657",
    "#2f8fd6", "#6a5ae0", "#c14bb0", "#4b5566"
  ];
  var ROJO_VENCIDA = "#b3261e";   // solo para tarjetas con la fecha pasada
  var ICONO_FECHA = '<svg viewBox="0 0 24 24" aria-hidden="true">'
    + '<rect x="3.5" y="5.5" width="17" height="15" rx="2.5"></rect>'
    + '<path d="M8 3.2v4.6M16 3.2v4.6M3.5 10.6h17"></path></svg>';
  var KEY = "prioridades.v2";
  var KEY_V1 = "prioridades.v1";
  var list = document.getElementById("list");
  var items = [];
  var puedeGuardar = true;

  /* --- datos --- */

  function nuevoId(){
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function nodo(kind, color){
    return { id: nuevoId(), kind: kind, name: "", subject: "", color: color, due: "",
             children: kind === "group" ? [] : undefined };
  }

  /* --- fechas limite --- */

  function hoyISO(){
    var d = new Date();
    return d.getFullYear() + "-"
      + ("0" + (d.getMonth() + 1)).slice(-2) + "-"
      + ("0" + d.getDate()).slice(-2);
  }

  function vencida(node){
    return !!node.due && node.due < hoyISO();
  }

  function formatoFecha(iso){
    var p = iso.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    try {
      // En ingles, a tono con las etiquetas Due to / Expired.
      return d.toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
    } catch (e) {
      return p[1] + "/" + p[2];
    }
  }

  function defaults(){
    return COLORS.slice(0, 5).map(function(color){
      var n = nodo("block", color);
      return n;
    });
  }

  function sanear(raw, esRaiz){
    if (!Array.isArray(raw)) return [];
    var out = [];
    raw.forEach(function(b, i){
      if (!b || typeof b !== "object") return;
      var kind = (b.kind === "group" && esRaiz) ? "group" : "block";
      var n = {
        id: String(b.id || nuevoId()),
        kind: kind,
        name: String(b.name || ""),
        subject: String(b.subject || ""),
        color: COLORS.indexOf(b.color) >= 0 ? b.color : COLORS[i % COLORS.length],
        due: /^\d{4}-\d{2}-\d{2}$/.test(b.due) ? b.due : ""
      };
      // Los grupos no anidan grupos: un nivel alcanza y se lee mejor.
      if (kind === "group") n.children = sanear(b.children, false);
      out.push(n);
    });
    return out;
  }

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var data = sanear(JSON.parse(raw), true);
        if (data.length) return data;
      }
      var viejo = localStorage.getItem(KEY_V1);   // datos de la version sin grupos
      if (viejo) {
        var previo = sanear(JSON.parse(viejo), true);
        if (previo.length) return previo;
      }
    } catch (e) {}
    return defaults();
  }

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch (e) {
      if (puedeGuardar) { puedeGuardar = false; avisar(); }
    }
  }

  function avisar(){
    var warn = document.getElementById("warn");
    warn.textContent = "Este visor no permite guardar los cambios. La app funciona, "
      + "pero se borra al cerrarla: abrila directamente en el navegador del celular "
      + "(Chrome o Safari) para que quede guardada.";
    warn.className = "warn show";
    var tip = document.querySelector(".tip");
    if (tip) tip.style.display = "none";
  }

  function todos(){
    var out = [];
    items.forEach(function(n){
      out.push(n);
      if (n.children) n.children.forEach(function(c){ out.push(c); });
    });
    return out;
  }

  function buscar(id){
    var found = null;
    todos().forEach(function(n){ if (n.id === id) found = n; });
    return found;
  }

  function contenedorDe(id){
    var cont = null;
    if (items.some(function(n){ return n.id === id; })) return items;
    items.forEach(function(n){
      if (n.children && n.children.some(function(c){ return c.id === id; })) cont = n.children;
    });
    return cont;
  }

  function sacar(id){
    var cont = contenedorDe(id);
    if (!cont) return null;
    for (var i = 0; i < cont.length; i++) {
      if (cont[i].id === id) return cont.splice(i, 1)[0];
    }
    return null;
  }

  /* --- dibujo --- */

  var estadoPlazos = "";

  function render(){
    list.innerHTML = "";
    items.forEach(function(node, i){ list.appendChild(nodeEl(node, i)); });
    estadoPlazos = firmaPlazos();
  }

  function firmaPlazos(){
    return todos().map(function(n){ return n.id + (vencida(n) ? "!" : ""); }).join(",");
  }

  // Una tarjeta puede vencer con la app abierta (pasa la medianoche): la
  // repintamos cuando cambia algo, nunca en medio de un arrastre.
  function revisarPlazos(){
    if (drag) return;
    if (firmaPlazos() !== estadoPlazos) render();
  }

  function nodeEl(node, index){
    var esGrupo = node.kind === "group";
    var el = document.createElement("div");
    el.className = "block" + (esGrupo ? " group" : "") + (vencida(node) ? " vencida" : "");
    // La tarjeta con la fecha pasada se pinta de rojo hasta que la resuelvas.
    el.style.background = vencida(node) ? ROJO_VENCIDA : node.color;
    el.dataset.id = node.id;

    var top = document.createElement("div");
    top.className = "row";
    var rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = String(index + 1);
    top.appendChild(rank);
    top.appendChild(field("name",
      esGrupo ? "Grupo (ej. Fin de semana)" : "Materia (ej. Historia)", node));
    top.appendChild(tool("⠿", "Arrastrar para ordenar", "handle", null));

    var bottom = document.createElement("div");
    bottom.className = "row";
    bottom.appendChild(field("subject",
      esGrupo ? "Cuándo (ej. sábado y domingo)" : "Tarea (ej. 1 hora de estudio)", node));
    var tools = document.createElement("div");
    tools.className = "tools";
    tools.appendChild(tool(ICONO_FECHA, "Fecha límite", "", function(){
      el.classList.remove("open-color");
      el.classList.toggle("open-fecha");
      var f = el.querySelector(":scope > .fechas > input");
      if (f && el.classList.contains("open-fecha")) f.focus();
    }));
    tools.appendChild(tool("●", "Cambiar color", "", function(){
      el.classList.remove("open-fecha");
      el.classList.toggle("open-color");
    }));
    tools.appendChild(tool("✕", esGrupo ? "Eliminar grupo" : "Eliminar tarjeta", "",
      function(){ remove(node.id); }, todos().length <= 1));
    bottom.appendChild(tools);

    el.appendChild(top);
    el.appendChild(bottom);
    if (node.due) el.appendChild(plazoEl(node));
    el.appendChild(fechaEl(node));
    el.appendChild(paletteEl(node));

    if (esGrupo) {
      var slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.groupId = node.id;
      if (!node.children.length) {
        var hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent = "Arrastrá tarjetas acá";
        slot.appendChild(hint);
      }
      node.children.forEach(function(child, i){ slot.appendChild(nodeEl(child, i)); });
      el.appendChild(slot);
    }

    el.querySelector(".handle").addEventListener("pointerdown", function(ev){
      startDrag(ev, el, node);
    });

    return el;
  }

  function field(key, placeholder, node){
    var input = document.createElement("input");
    input.type = "text";
    input.className = key;
    input.placeholder = placeholder;
    input.value = node[key];
    input.setAttribute("aria-label", placeholder);
    input.addEventListener("input", function(){
      node[key] = input.value;
      save();
    });
    return input;
  }

  function tool(label, title, extra, onClick, disabled){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tool " + extra;
    if (label.charAt(0) === "<") btn.innerHTML = label; else btn.textContent = label;
    btn.title = title;
    btn.setAttribute("aria-label", title);
    if (disabled) btn.disabled = true;
    if (onClick) btn.addEventListener("click", onClick);
    return btn;
  }

  function plazoEl(node){
    var p = document.createElement("div");
    var tarde = vencida(node);
    var hoy = node.due === hoyISO();
    p.className = "plazo" + (tarde ? " tarde" : "");
    p.textContent = tarde
      ? "⚠ Expired · " + formatoFecha(node.due)
      : (hoy ? "Due today" : "Due " + formatoFecha(node.due));
    return p;
  }

  function fechaEl(node){
    var caja = document.createElement("div");
    caja.className = "fechas";

    var input = document.createElement("input");
    input.type = "date";
    input.value = node.due || "";
    input.setAttribute("aria-label", "Fecha límite");
    input.addEventListener("change", function(){
      node.due = /^\d{4}-\d{2}-\d{2}$/.test(input.value) ? input.value : "";
      save();
      render();
    });
    caja.appendChild(input);

    if (node.due) {
      var quitar = document.createElement("button");
      quitar.type = "button";
      quitar.className = "tool ancho";
      quitar.textContent = "Quitar";
      quitar.addEventListener("click", function(){
        node.due = "";
        save();
        render();
      });
      caja.appendChild(quitar);
    }
    return caja;
  }

  function paletteEl(node){
    var pal = document.createElement("div");
    pal.className = "palette";
    COLORS.forEach(function(color){
      var sw = document.createElement("button");
      sw.type = "button";
      sw.className = "swatch" + (color === node.color ? " current" : "");
      sw.style.background = color;
      sw.title = "Usar este color";
      sw.setAttribute("aria-label", "Usar color " + color);
      sw.addEventListener("click", function(){ setColor(node.id, color); });
      pal.appendChild(sw);
    });
    return pal;
  }

  /* --- acciones --- */

  function mismoTitulo(a, b){
    var x = (a.name || "").trim().toLowerCase();
    var y = (b.name || "").trim().toLowerCase();
    return x !== "" && x === y;
  }

  function setColor(id, color){
    var node = buscar(id);
    if (!node || node.color === color) return;

    // Dos tarjetas de la misma materia pueden compartir color. Con titulos
    // distintos se intercambian, para que no se confundan entre si.
    var choque = todos().filter(function(n){
      return n !== node && n.color === color && !mismoTitulo(n, node);
    })[0];
    if (choque) choque.color = node.color;

    node.color = color;
    save();
    render();
  }

  function remove(id){
    if (todos().length <= 1) return;
    var el = document.querySelector('.block[data-id="' + id + '"]');
    var sinMovimiento = window.matchMedia
      && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!el || sinMovimiento) { borrarDelModelo(id); return; }
    if (el.classList.contains("cerrando")) return;   // ya esta en camino
    el.classList.add("cerrando");

    // 1) se tacha cada campo, como cuando marcás algo hecho en papel
    Array.prototype.forEach.call(el.children, function(row){
      if (!row.classList.contains("row")) return;
      var input = row.querySelector("input");
      if (!input) return;
      var ancho = anchoDelTexto(input);
      if (!ancho) return;                 // campo vacio: no hay nada que tachar
      var linea = document.createElement("span");
      linea.className = "tachon";
      linea.style.left = input.offsetLeft + "px";
      linea.style.top = (input.offsetTop + input.offsetHeight / 2) + "px";
      linea.style.width = ancho + "px";
      row.appendChild(linea);
    });

    // 2) el sello DONE con el tilde
    var sello = document.createElement("div");
    sello.className = "sello";
    sello.innerHTML = '<div class="pastilla">'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 6.8"/></svg>'
      + '<span>DONE</span></div>';
    el.appendChild(sello);

    // 3) recien despues se pliega y desaparece
    setTimeout(function(){
      el.style.height = el.getBoundingClientRect().height + "px";
      el.classList.add("colapsando");
      void el.offsetHeight;
      el.style.height = "0px";
      el.style.opacity = "0";
      el.style.marginTop = "-12px";
      setTimeout(function(){ borrarDelModelo(id); }, 300);
    }, 1050);
  }

  function anchoDelTexto(input){
    if (!input.value) return 0;
    var cs = getComputedStyle(input);
    var canvas = anchoDelTexto.canvas || (anchoDelTexto.canvas = document.createElement("canvas"));
    var ctx = canvas.getContext("2d");
    ctx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    return Math.min(Math.ceil(ctx.measureText(input.value).width) + 4, input.offsetWidth);
  }

  function borrarDelModelo(id){
    var node = buscar(id);
    if (!node) return;
    var cont = contenedorDe(id);
    var pos = cont.indexOf(node);
    // Al borrar un grupo, lo de adentro no se pierde: sube al nivel principal.
    if (node.kind === "group" && node.children.length) {
      var sueltos = node.children.slice();
      cont.splice.apply(cont, [pos, 1].concat(sueltos));
    } else {
      cont.splice(pos, 1);
    }
    save();
    render();
  }

  function colorLibre(){
    var usados = todos().map(function(n){ return n.color; });
    var libre = COLORS.filter(function(c){ return usados.indexOf(c) < 0; })[0];
    return libre || COLORS[todos().length % COLORS.length];
  }

  function agregar(kind){
    var node = nodo(kind, colorLibre());
    items.push(node);
    save();
    render();

    // Lo nuevo queda al final: lo mostramos y le damos foco para que se note
    // aunque el boton estuviera al pie de la pantalla.
    var el = list.lastElementChild;
    if (!el) return;
    el.classList.add("nuevo");
    try { el.scrollIntoView({ block: "center", behavior: "smooth" }); }
    catch (e) { el.scrollIntoView(false); }
    var input = el.querySelector("input.name");
    if (input) input.focus();
  }

  /* --- arrastrar y soltar (mouse y dedo) --- */

  var drag = null;
  var placeholder = document.createElement("div");
  placeholder.className = "placeholder";

  function startDrag(ev, el, node){
    if (drag || (ev.pointerType === "mouse" && ev.button !== 0)) return;
    ev.preventDefault();

    var rect = el.getBoundingClientRect();
    drag = {
      el: el, node: node,
      startX: ev.clientX, startY: ev.clientY,
      x: ev.clientX, y: ev.clientY,
      left: rect.left, top: rect.top
    };

    placeholder.style.height = rect.height + "px";
    el.parentNode.insertBefore(placeholder, el);

    el.classList.add("dragging");
    el.style.position = "fixed";
    el.style.width = rect.width + "px";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.margin = "0";
    document.body.appendChild(el);

    window.addEventListener("pointermove", onDragMove, { passive: false });
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("pointercancel", endDrag);
    autoScroll();
  }

  function onDragMove(ev){
    if (!drag) return;
    ev.preventDefault();
    drag.x = ev.clientX;
    drag.y = ev.clientY;
    drag.el.style.transform = "translate(" + (drag.x - drag.startX) + "px,"
      + (drag.y - drag.startY) + "px)";
    ubicarPlaceholder();
  }

  function ubicarPlaceholder(){
    var destino = contenedorBajoPuntero(drag.x, drag.y);
    var hijos = Array.prototype.slice.call(destino.children).filter(function(c){
      return c.classList.contains("block") && c !== placeholder;
    });

    var antes = null;
    for (var i = 0; i < hijos.length; i++) {
      var r = hijos[i].getBoundingClientRect();
      if (drag.y < r.top + r.height / 2) { antes = hijos[i]; break; }
    }
    if (placeholder.parentNode !== destino || placeholder.nextSibling !== antes) {
      // Mover el hueco cambia el alto de lo que hay arriba, asi que el
      // destino se correria solo debajo del dedo. Compensamos el scroll
      // para que lo que estas apuntando se quede donde esta.
      var refEl = destino === list ? (antes || placeholder) : destino;
      var antesTop = refEl.getBoundingClientRect().top;
      destino.insertBefore(placeholder, antes);
      var salto = refEl.getBoundingClientRect().top - antesTop;
      if (salto) window.scrollBy(0, salto);
    }

    Array.prototype.forEach.call(document.querySelectorAll(".slot"), function(s){
      s.classList.toggle("hover", s === destino);
    });
  }

  function dentroDe(el, x, y, margenX, margenY){
    var r = el.getBoundingClientRect();
    return x >= r.left - margenX && x <= r.right + margenX
        && y >= r.top - margenY && y <= r.bottom + margenY;
  }

  function contenedorBajoPuntero(x, y){
    // Un grupo no entra dentro de otro grupo: solo las tarjetas sueltas
    // pueden caer en un hueco.
    if (drag.node.kind === "group") return list;

    // Salir de un hueco cuesta mas que entrar: sin ese margen, el hueco se
    // escapa apenas entra la tarjeta y queda entrando y saliendo sola.
    var actual = placeholder.parentNode;
    if (actual && actual.classList.contains("slot") && dentroDe(actual, x, y, 24, 30)) {
      return actual;
    }

    var slots = document.querySelectorAll(".slot");
    for (var i = 0; i < slots.length; i++) {
      if (dentroDe(slots[i], x, y, 0, 8)) return slots[i];
    }
    return list;
  }

  function autoScroll(){
    if (!drag) return;
    var margen = 90, paso = 0;
    if (drag.y < margen) paso = -Math.ceil((margen - drag.y) / 6);
    else if (drag.y > window.innerHeight - margen) paso = Math.ceil((drag.y - (window.innerHeight - margen)) / 6);
    if (paso) {
      window.scrollBy(0, paso);
      ubicarPlaceholder();
    }
    requestAnimationFrame(autoScroll);
  }

  function endDrag(){
    if (!drag) return;
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", endDrag);
    window.removeEventListener("pointercancel", endDrag);

    var destino = placeholder.parentNode || list;
    var hijos = Array.prototype.slice.call(destino.children).filter(function(c){
      return c === placeholder || c.classList.contains("block");
    });
    var index = hijos.indexOf(placeholder);
    var grupoId = destino === list ? null : destino.dataset.groupId;

    var node = sacar(drag.node.id);
    if (node) {
      var lista = items;
      if (grupoId) {
        var grupo = buscar(grupoId);
        if (grupo && grupo.children) lista = grupo.children;
      }
      if (index < 0 || index > lista.length) index = lista.length;
      lista.splice(index, 0, node);
      save();
    }

    if (placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    drag.el.remove();
    drag = null;
    render();
  }

  /* --- copia de seguridad --- */

  function exportar(){
    var texto = JSON.stringify(items, null, 2);
    var fecha = new Date().toISOString().slice(0, 10);

    // Dentro de un visor embebido la descarga esta bloqueada: al menos
    // dejamos la copia en el portapapeles y avisamos por que.
    if (window.self !== window.top) {
      var aviso = "Para bajar el archivo hay que abrir la app en su propia "
        + "pestaña. Mientras tanto, copiá este texto y guardalo en una nota.";
      try {
        navigator.clipboard.writeText(texto).then(function(){
          alert("Copié la copia al portapapeles. " + aviso);
        }, function(){ prompt(aviso, texto); });
      } catch (e) {
        prompt(aviso, texto);
      }
      return;
    }

    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto], { type: "application/json" }));
    a.download = "prioridades-" + fecha + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 0);
  }

  function importar(archivo){
    var lector = new FileReader();
    lector.onload = function(){
      var datos;
      try { datos = sanear(JSON.parse(lector.result), true); }
      catch (e) { datos = []; }
      if (!datos.length) {
        alert("Esa copia no se pudo leer. Elegí un archivo prioridades-….json.");
        return;
      }
      if (!confirm("Reemplazar lo que tenés ahora por la copia?")) return;
      items = datos;
      save();
      render();
    };
    lector.readAsText(archivo);
  }

  /* --- arranque --- */

  document.getElementById("add").addEventListener("click", function(){ agregar("block"); });
  document.getElementById("addGroup").addEventListener("click", function(){ agregar("group"); });
  document.getElementById("export").addEventListener("click", exportar);
  document.getElementById("import").addEventListener("click", function(){
    document.getElementById("file").click();
  });
  document.getElementById("file").addEventListener("change", function(ev){
    if (ev.target.files[0]) importar(ev.target.files[0]);
    ev.target.value = "";
  });
  document.getElementById("reset").addEventListener("click", function(){
    if (!confirm("¿Vaciar todo y volver a las 5 tarjetas iniciales?")) return;
    items = defaults();
    save();
    render();
  });

  try {
    localStorage.setItem(KEY + ".test", "1");
    localStorage.removeItem(KEY + ".test");
  } catch (e) {
    puedeGuardar = false;
    avisar();
  }

  items = load();
  render();

  setInterval(revisarPlazos, 60000);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) revisarPlazos();
  });

  // Instalable y offline: solo corre servida por http(s), no como archivo suelto.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    var teniaControlador = !!navigator.serviceWorker.controller;
    var recargando = false;

    // Cuando entra una version nueva, la pantalla se rehace sola una vez
    // para no quedar mostrando la anterior.
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (!teniaControlador || recargando) return;
      recargando = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        reg.update();
      }).catch(function(){});
    });
  }
})();
</script>
</body>
