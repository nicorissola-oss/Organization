<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prioridades</title>
<style>
  /* Tema claro por defecto; el oscuro se aplica por preferencia del sistema
     o cuando el visor marca data-theme en la raiz. */
  :root{
    --bg:#f4f5fa;
    --bg-soft:#ffffff;
    --text:#14162a;
    --muted:#6b7192;
    --line:rgba(20,22,42,.12);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1220;
      --bg-soft:#171a2e;
      --text:#f2f3f8;
      --muted:#9aa0bd;
      --line:rgba(255,255,255,.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1220;
    --bg-soft:#171a2e;
    --text:#f2f3f8;
    --muted:#9aa0bd;
    --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em}
  .sub{margin:6px 0 20px;color:var(--muted);font-size:13.5px;line-height:1.45}

  button{touch-action:manipulation}
  .ghost-btn{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:11px 18px;min-height:44px;font-size:14px;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .ghost-btn:hover{color:var(--text)}
  .ghost-btn:active{transform:scale(.97)}
  #add{
    width:100%;max-width:320px;font-size:15px;
    border-style:dashed;border-width:1.5px;color:var(--text);
  }
  .warn{
    display:none;margin:0 0 16px;padding:11px 13px;border-radius:12px;
    background:rgba(224,69,63,.12);border:1px solid rgba(224,69,63,.45);
    color:var(--text);font-size:12.5px;line-height:1.5;
  }
  .warn.show{display:block}

  #list{position:relative;display:flex;flex-direction:column;gap:12px}

  .block{
    position:relative;
    display:flex;flex-direction:column;gap:8px;
    border-radius:var(--radius);
    padding:12px 12px 12px 13px;
    color:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    touch-action:pan-y;
    will-change:transform;
  }
  .row{display:flex;align-items:center;gap:10px;min-width:0}
  .block.dragging{
    z-index:20;
    box-shadow:0 16px 34px rgba(0,0,0,.35);
    transform:scale(1.02);
    cursor:grabbing;
  }
  .block.settling{transition:transform .18s ease}

  .rank{
    flex:0 0 auto;width:26px;height:26px;border-radius:9px;
    background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  }

  .block input{
    width:100%;background:transparent;border:0;color:#fff;
    font-family:inherit;padding:2px 0;border-radius:6px;
  }
  .block input:focus{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
  .name{flex:1 1 auto;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
  .subject{flex:1 1 auto;min-width:0;font-size:13.5px;opacity:.92}
  .block input::placeholder{color:rgba(255,255,255,.6);font-weight:500}

  .tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
  .tool{
    width:34px;height:30px;border:0;border-radius:8px;
    background:rgba(255,255,255,.18);color:#fff;
    font-size:13px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .tool:hover{background:rgba(255,255,255,.3)}
  .tool:focus-visible,.swatch:focus-visible,.ghost-btn:focus-visible{
    outline:2px solid currentColor;outline-offset:2px;
  }
  .tool[disabled]{opacity:.3;cursor:default}
  .handle{cursor:grab;touch-action:none}
  .handle:active{cursor:grabbing}

  .palette{
    display:none;gap:8px;flex-wrap:wrap;
    padding:10px 4px 2px;margin-top:10px;
    border-top:1px solid rgba(255,255,255,.25);
  }
  .block.open .palette{display:flex}
  .swatch{
    width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
    cursor:pointer;padding:0;
  }
  .swatch.current{box-shadow:0 0 0 3px rgba(255,255,255,.85)}

  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .block.nuevo{animation:pop .28s ease-out}

  @media (prefers-reduced-motion: reduce){
    .block.nuevo{animation:none}
    .block.settling{transition:none}
  }

  .footer{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tip{margin-top:18px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prioridades</h1>
    <button class="ghost-btn" id="reset" type="button">Vaciar</button>
  </header>
  <p class="sub">Arriba lo que estudias primero. Arrastrá desde ⠿ o usá las flechas para reordenar.</p>

  <p class="warn" id="warn"></p>

  <div id="list"></div>

  <div class="footer">
    <button class="ghost-btn" id="add" type="button">+ Agregar bloque</button>
  </div>
  <p class="tip">Se guarda solo en este dispositivo.</p>
</div>

<script>
(function(){
  "use strict";

  var COLORS = [
    "#e0453f", "#e8792c", "#e3b31c", "#3aa657",
    "#2f8fd6", "#6a5ae0", "#c14bb0", "#4b5566"
  ];
  var KEY = "prioridades.v1";
  var list = document.getElementById("list");
  var blocks = [];

  function defaults(){
    return COLORS.slice(0, 5).map(function(color, i){
      return { id: "b" + Date.now() + i, name: "", subject: "", color: color };
    });
  }

  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      var data = JSON.parse(raw);
      if (!Array.isArray(data) || !data.length) return defaults();
      return data.map(function(b, i){
        return {
          id: String(b.id || ("b" + i)),
          name: String(b.name || ""),
          subject: String(b.subject || ""),
          color: COLORS.indexOf(b.color) >= 0 ? b.color : COLORS[i % COLORS.length]
        };
      });
    } catch (e) {
      return defaults();
    }
  }

  var puedeGuardar = true;

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(blocks));
    } catch (e) {
      if (puedeGuardar) { puedeGuardar = false; avisar(); }
    }
  }

  function avisar(){
    var warn = document.getElementById("warn");
    warn.textContent = "Este visor no permite guardar los cambios. La app funciona, "
      + "pero se borra al cerrarla: abrila directamente en el navegador del celular "
      + "(Chrome o Safari) para que quede guardada.";
    warn.className = "warn show";
    var tip = document.querySelector(".tip");
    if (tip) tip.style.display = "none";
  }

  function render(){
    list.innerHTML = "";
    blocks.forEach(function(block, index){
      list.appendChild(blockEl(block, index));
    });
  }

  function blockEl(block, index){
    var el = document.createElement("div");
    el.className = "block";
    el.style.background = block.color;
    el.dataset.id = block.id;

    var top = document.createElement("div");
    top.className = "row";
    var rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = String(index + 1);
    top.appendChild(rank);
    top.appendChild(field("name", "Materia (ej. Historia)", block.name, block));
    top.appendChild(tool("\u283f", "Arrastrar para reordenar", "handle", null));

    var bottom = document.createElement("div");
    bottom.className = "row";
    bottom.appendChild(field("subject", "Tarea (ej. 1 hora de estudio)", block.subject, block));
    var tools = document.createElement("div");
    tools.className = "tools";
    tools.appendChild(tool("\u25b2", "Subir", "", function(){ move(block.id, -1); }, index === 0));
    tools.appendChild(tool("\u25bc", "Bajar", "", function(){ move(block.id, 1); }, index === blocks.length - 1));
    tools.appendChild(tool("\u25cf", "Cambiar color", "", function(){ el.classList.toggle("open"); }));
    tools.appendChild(tool("\u2715", "Eliminar bloque", "", function(){ remove(block.id); }, blocks.length <= 1));
    bottom.appendChild(tools);

    el.appendChild(top);
    el.appendChild(bottom);
    el.appendChild(paletteEl(block));

    el.querySelector(".handle").addEventListener("pointerdown", function(ev){
      startDrag(ev, el);
    });

    return el;
  }

  function field(key, placeholder, value, block){
    var input = document.createElement("input");
    input.type = "text";
    input.className = key;
    input.placeholder = placeholder;
    input.value = value;
    input.setAttribute("aria-label", key === "name" ? "Materia" : "Tarea");
    input.addEventListener("input", function(){
      block[key] = input.value;
      save();
    });
    return input;
  }

  function tool(label, title, extra, onClick, disabled){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tool " + extra;
    btn.textContent = label;
    btn.title = title;
    btn.setAttribute("aria-label", title);
    if (disabled) btn.disabled = true;
    if (onClick) btn.addEventListener("click", onClick);
    return btn;
  }

  function paletteEl(block){
    var pal = document.createElement("div");
    pal.className = "palette";
    COLORS.forEach(function(color){
      var sw = document.createElement("button");
      sw.type = "button";
      sw.className = "swatch" + (color === block.color ? " current" : "");
      sw.style.background = color;
      sw.title = "Usar este color";
      sw.setAttribute("aria-label", "Usar color " + color);
      sw.addEventListener("click", function(){
        setColor(block.id, color);
      });
      pal.appendChild(sw);
    });
    return pal;
  }

  /* --- acciones --- */

  function indexOf(id){
    for (var i = 0; i < blocks.length; i++) if (blocks[i].id === id) return i;
    return -1;
  }

  function move(id, delta){
    var from = indexOf(id);
    var to = from + delta;
    if (from < 0 || to < 0 || to >= blocks.length) return;
    blocks.splice(to, 0, blocks.splice(from, 1)[0]);
    save();
    render();
  }

  function setColor(id, color){
    var target = blocks[indexOf(id)];
    if (!target || target.color === color) return;
    // Si otro bloque ya tiene ese color, los intercambian.
    var other = blocks.filter(function(b){ return b.color === color; })[0];
    if (other) other.color = target.color;
    target.color = color;
    save();
    render();
  }

  function remove(id){
    if (blocks.length <= 1) return;
    blocks.splice(indexOf(id), 1);
    save();
    render();
  }

  function add(){
    var used = blocks.map(function(b){ return b.color; });
    var free = COLORS.filter(function(c){ return used.indexOf(c) < 0; })[0];
    blocks.push({
      id: "b" + Date.now() + "-" + blocks.length,
      name: "",
      subject: "",
      color: free || COLORS[blocks.length % COLORS.length]
    });
    save();
    render();

    // El bloque nuevo queda al final: lo mostramos y le damos foco para que
    // se note que se agrego aunque el boton estuviera al pie de la pantalla.
    var el = list.lastElementChild;
    if (!el) return;
    el.classList.add("nuevo");
    try { el.scrollIntoView({ block: "center", behavior: "smooth" }); }
    catch (e) { el.scrollIntoView(false); }
    var input = el.querySelector("input.name");
    if (input) input.focus();
  }

  /* --- arrastrar y soltar (mouse y touch) --- */

  var drag = null;

  function startDrag(ev, el){
    if (drag || ev.button === 1 || ev.button === 2) return;
    ev.preventDefault();

    var items = Array.prototype.slice.call(list.children);
    var rects = items.map(function(item){ return item.getBoundingClientRect(); });
    var from = items.indexOf(el);
    var stride = rects.length > 1
      ? Math.abs(rects[1].top - rects[0].top)
      : rects[0].height + 12;

    drag = { el: el, items: items, from: from, to: from, startY: ev.clientY, stride: stride };

    el.classList.add("dragging");
    el.setPointerCapture(ev.pointerId);
    el.addEventListener("pointermove", onDragMove);
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  }

  function onDragMove(ev){
    if (!drag) return;
    var dy = ev.clientY - drag.startY;
    drag.el.style.transform = "translateY(" + dy + "px)";

    var to = drag.from + Math.round(dy / drag.stride);
    to = Math.max(0, Math.min(drag.items.length - 1, to));
    if (to === drag.to) return;
    drag.to = to;

    drag.items.forEach(function(item, i){
      if (item === drag.el) return;
      var shift = 0;
      if (drag.from < to && i > drag.from && i <= to) shift = -drag.stride;
      else if (drag.from > to && i < drag.from && i >= to) shift = drag.stride;
      item.classList.add("settling");
      item.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
  }

  function endDrag(ev){
    if (!drag) return;
    var el = drag.el;
    el.removeEventListener("pointermove", onDragMove);
    el.removeEventListener("pointerup", endDrag);
    el.removeEventListener("pointercancel", endDrag);
    try { el.releasePointerCapture(ev.pointerId); } catch (e) {}

    var from = drag.from, to = drag.to;
    drag.items.forEach(function(item){
      item.classList.remove("settling");
      item.style.transform = "";
    });
    el.classList.remove("dragging");
    drag = null;

    if (from !== to) {
      blocks.splice(to, 0, blocks.splice(from, 1)[0]);
      save();
    }
    render();
  }

  /* --- arranque --- */

  document.getElementById("add").addEventListener("click", add);
  document.getElementById("reset").addEventListener("click", function(){
    if (!confirm("¿Vaciar todos los bloques y volver a los 5 iniciales?")) return;
    blocks = defaults();
    save();
    render();
  });

  try {
    localStorage.setItem(KEY + ".test", "1");
    localStorage.removeItem(KEY + ".test");
  } catch (e) {
    puedeGuardar = false;
    avisar();
  }

  blocks = load();
  render();
})();
</script>
</body>
</html>
